<circle cx="56" cy="434" r="3.5" fill="#3DD68C"/><text x="68" y="439" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >the model proposes; the policy engine authorises every step</text>
<circle cx="436" cy="434" r="3.5" fill="#3DD68C"/><text x="448" y="439" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >mutations never overlap anything — max one per request</text>

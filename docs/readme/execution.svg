@keyframes kc { 0%, 5.0% { opacity: .22; } 7.5%, 90% { opacity: 1; } 97%, 100% { opacity: .22; } } .nc { animation: kc 12.0s ease-out infinite; }
@keyframes kd { 0%, 18.3% { opacity: .22; } 20.8%, 90% { opacity: 1; } 97%, 100% { opacity: .22; } } .nd { animation: kd 12.0s ease-out infinite; }
@keyframes ke { 0%, 31.7% { opacity: .22; } 34.2%, 90% { opacity: 1; } 97%, 100% { opacity: .22; } } .ne { animation: ke 12.0s ease-out infinite; }
@keyframes kf { 0%, 46.7% { opacity: .22; } 49.2%, 90% { opacity: 1; } 97%, 100% { opacity: .22; } } .nf { animation: kf 12.0s ease-out infinite; }
@keyframes kg { 0%, 61.7% { opacity: .22; } 64.2%, 90% { opacity: 1; } 97%, 100% { opacity: .22; } } .ng { animation: kg 12.0s ease-out infinite; }
@keyframes kr { 0%, 75.0% { opacity: .22; } 77.5%, 90% { opacity: 1; } 97%, 100% { opacity: .22; } } .nr { animation: kr 12.0s ease-out infinite; }
@keyframes tick { 0%, 65.8% { opacity: 0; } 67.8%, 90% { opacity: 1; } 97%, 100% { opacity: 0; } } .tick { animation: tick 12.0s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>

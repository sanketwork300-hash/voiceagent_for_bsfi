<text x="40" y="52" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9C9CA6" text-anchor="start" letter-spacing="3">ONE REQUEST · ONE EXECUTION PLAN</text>
<rect x="40" y="72" width="1120" height="52" rx="26" fill="#1B1B1F" stroke="#2C2C33" />
<text x="64" y="104" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#F4F4F5" text-anchor="start" >“What&#x27;s my balance and recent transactions? Also send ₹1,000 to Rahul.”</text>
<text x="40" y="158" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#9C9CA6" text-anchor="start" letter-spacing="1.5">WAVE 1 · asyncio.gather</text>
<text x="316" y="318" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#9C9CA6" text-anchor="start" letter-spacing="1.5">WAVE 2</text>

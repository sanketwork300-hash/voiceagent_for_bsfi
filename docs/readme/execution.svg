<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="t d">
<title id="t">Execution plan</title>
<desc id="d">Three reads run in parallel, the beneficiary is checked, the transfer waits for transaction OTP and confirmation, runs alone with an idempotency key, is verified, then the answer is composed.</desc>
<style>


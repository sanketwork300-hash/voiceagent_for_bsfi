<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
<title id="t">Architecture</title>
<desc id="d">Channels feed one shared agent runtime (reason, plan, policy, execute, verify, respond) which calls the institution through a tool gateway; Redis and PostgreSQL hold shared state.</desc>
<style>

.flow { stroke-dasharray: 6 6; animation: dash 1s linear infinite; }
.flow.slow { animation-duration: 2.4s; }
@keyframes dash { to { stroke-dashoffset: -12; } }
.stage { animation: sweep 6s ease-in-out infinite; }
.s0 { animation-delay: 0s; }
.s1 { animation-delay: 1s; }
.s2 { animation-delay: 2s; }
.s3 { animation-delay: 3s; }
.s4 { animation-delay: 4s; }
.s5 { animation-delay: 5s; }
@keyframes sweep { 0% { stroke: #2C2C33; } 4% { stroke: #3DD68C; } 16% { stroke: #3DD68C; } 22% { stroke: #2C2C33; } 100% { stroke: #2C2C33; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="1200" height="640" rx="22" fill="#0A0A0B" stroke="#2C2C33"/>
<text x="40" y="52" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#9C9CA6" text-anchor="start" letter-spacing="3">ARCHITECTURE</text>
<text x="40" y="82" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#F4F4F5" text-anchor="start" >Channels are thin adapters. Every decision is made once, in the shared runtime.</text>
<text x="40" y="124" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#9C9CA6" text-anchor="start" letter-spacing="2">CHANNELS</text>
<rect x="40" y="136" width="230" height="72" rx="14" fill="#141417" stroke="#2C2C33" /><rect x="40" y="150" width="3" height="44" rx="1.5" fill="#6EA8FE"/><text x="58" y="166" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F4F5" text-anchor="start" >Phone call</text><text x="58" y="188" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >PSTN → LiveKit phone number</text>
<rect x="40" y="226" width="230" height="72" rx="14" fill="#141417" stroke="#2C2C33" /><rect x="40" y="240" width="3" height="44" rx="1.5" fill="#6EA8FE"/><text x="58" y="256" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F4F5" text-anchor="start" >App / web voice</text><text x="58" y="278" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >WebRTC into a LiveKit room</text>
<rect x="40" y="316" width="230" height="72" rx="14" fill="#141417" stroke="#2C2C33" /><rect x="40" y="330" width="3" height="44" rx="1.5" fill="#6EA8FE"/><text x="58" y="346" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F4F5" text-anchor="start" >Chat</text><text x="58" y="368" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >REST · WebSocket streaming</text>
<text x="310" y="124" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#9C9CA6" text-anchor="start" letter-spacing="2">REALTIME</text>
<rect x="310" y="136" width="240" height="162" rx="14" fill="#141417" stroke="#2C2C33" /><rect x="310" y="150" width="3" height="134" rx="1.5" fill="#6EA8FE"/><text x="328" y="166" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F4F5" text-anchor="start" >LiveKit voice worker</text><text x="328" y="188" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >one room + process per call</text>
<text x="328" y="220" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >· VAD · turn detection</text>
<text x="328" y="242" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >· streaming STT / TTS</text>
<text x="328" y="264" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >· barge-in · neutral acks</text>
<rect x="310" y="316" width="240" height="72" rx="14" fill="#141417" stroke="#2C2C33" /><rect x="310" y="330" width="3" height="44" rx="1.5" fill="#6EA8FE"/><text x="328" y="346" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#F4F4F5" text-anchor="start" >Chat gateway</text><text x="328" y="368" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#9C9CA6" text-anchor="start" >same session, any channel</text>
<text x="590" y="124" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#9C9CA6" text-anchor="start" letter-spacing="2">AGENT RUNTIME</text>

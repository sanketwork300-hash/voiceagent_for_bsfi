[project]
name = "bfsi-agent-platform"
version = "0.1.0"
description = "Multi-tenant BFSI chat + voice AI agent platform backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "redis>=5.0",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "cryptography>=42",
    "pypdf>=4.2",
    "jsonschema>=4.22",
    "python-multipart>=0.0.9",
    "elasticsearch[async]>=8.13,<9",
    # bounded to what livekit-agents supports so the API and voice-worker images resolve identically
    "opentelemetry-api>=1.39,<1.45",
    "opentelemetry-sdk>=1.39,<1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.39,<1.45",
    "opentelemetry-instrumentation-fastapi>=0.60b0,<0.66",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
voice = [
    "livekit-agents[silero,turn-detector,openai,deepgram,sarvam,elevenlabs]>=1.2,<2",
    "livekit-api>=1.0",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mock_bank*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "elasticsearch: requires a running Elasticsearch (skipped otherwise)",
]
